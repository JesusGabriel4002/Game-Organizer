name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # Signing turns on automatically once the SignPath secret and variables exist in the repo settings.
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Inject public Supabase config
        shell: pwsh
        run: |
          @"
          VITE_SUPABASE_URL=$env:VITE_SUPABASE_URL
          VITE_SUPABASE_ANON_KEY=$env:VITE_SUPABASE_ANON_KEY
          "@ | Set-Content .env
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - run: npx tauri build

      - name: Collect installer
        id: collect
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "A tag ${{ github.ref_name }} não bate com a versão $version do tauri.conf.json. Rode npm run bump."
          }
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe |
            ForEach-Object { Copy-Item $_.FullName (Join-Path out ($_.Name -replace ' ', '.')) }
          Get-ChildItem out
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: out/

      - name: Sign with SignPath
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Game-Organizer' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Every release needs a manual approval in SignPath; give it up to an hour.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(steps.collect.outputs.version) }}

      - name: Pick files to publish
        id: files
        shell: pwsh
        run: |
          $dir = if ("${{ env.SIGNPATH_ENABLED }}" -eq "true") { "signed" } else { "out" }
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          name: Game Organizer ${{ github.ref_name }}
          files: ${{ steps.files.outputs.dir }}/*.exe
          generate_release_notes: true
          body: |
            **Como instalar:** baixe o arquivo `*-setup.exe` abaixo e execute.

            Os dados ficam salvos localmente (SQLite); nada vai para a nuvem. A busca de jogos consulta o IGDB por um servidor intermediário apenas quando você pesquisa um jogo.

            ### Code signing policy
            Veja a [política de assinatura de código](https://github.com/${{ github.repository }}#code-signing-policy).
