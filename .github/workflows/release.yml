name: Release

# Publishes a release when a push to main carries a version (tauri.conf.json) that has no tag yet,
# or when a v* tag is pushed by hand. Bump the version with `npm run bump -- X.Y.Z` to ship.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide whether to release
        id: decide
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::A tag $GITHUB_REF_NAME não bate com a versão $version do tauri.conf.json. Rode npm run bump."
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "A versão $version já foi publicada ($tag); nada a fazer. Rode npm run bump para soltar outra."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Versão nova $version: publicando $tag."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    env:
      # Signing turns on automatically once the SignPath secret and variables exist in the repo settings.
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Inject public Supabase config
        shell: pwsh
        run: |
          @"
          VITE_SUPABASE_URL=$env:VITE_SUPABASE_URL
          VITE_SUPABASE_ANON_KEY=$env:VITE_SUPABASE_ANON_KEY
          "@ | Set-Content .env
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Build
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Collect installer
        id: collect
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe |
            ForEach-Object { Copy-Item $_.FullName (Join-Path out ($_.Name -replace ' ', '.')) }
          Get-ChildItem out
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: out/

      - name: Sign with SignPath
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Game-Organizer' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Every release needs a manual approval in SignPath; give it up to an hour.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(steps.collect.outputs.version) }}

      - name: Sign updater manifest
        id: files
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $src = if ("${{ env.SIGNPATH_ENABLED }}" -eq "true") { "signed" } else { "out" }
          $found = Get-ChildItem $src -Recurse -Filter *-setup.exe | Select-Object -First 1
          if (-not $found) { throw "Instalador não encontrado em $src" }
          $publish = Join-Path (Get-Location) "publish"
          New-Item -ItemType Directory -Force $publish | Out-Null
          $exePath = Join-Path $publish $found.Name
          Copy-Item $found.FullName $exePath -Force
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          npx tauri signer sign $exePath --app-version $version
          if ($LASTEXITCODE -ne 0) { throw "Falha ao assinar o atualizador" }
          $sig = (Get-Content "$exePath.sig" -Raw).Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ needs.check.outputs.tag }}/$($found.Name)"
          $manifest = [ordered]@{
            version = $version
            notes = "Game Organizer $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64-nsis" = [ordered]@{ signature = $sig; url = $url }
              "windows-x86_64" = [ordered]@{ signature = $sig; url = $url }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText((Join-Path $publish "latest.json"), $json)
          "dir=publish" >> $env:GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Game Organizer ${{ needs.check.outputs.tag }}
          files: |
            ${{ steps.files.outputs.dir }}/*.exe
            ${{ steps.files.outputs.dir }}/latest.json
            ${{ steps.files.outputs.dir }}/*.sig
          generate_release_notes: true
          body: |
            **Como instalar:** baixe o arquivo `*-setup.exe` abaixo e execute. Quem já tem esta versão ou uma mais nova recebe a atualização ao abrir o app.

            Os dados ficam neste computador. Com uma conta, a biblioteca também sincroniza na nuvem. A busca de jogos consulta o IGDB por um servidor intermediário apenas quando você pesquisa um jogo.

            ### Code signing policy
            Veja a [política de assinatura de código](https://github.com/${{ github.repository }}#code-signing-policy).

  android:
    needs: [check, build-windows]
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/android.yml
    with:
      release_tag: ${{ needs.check.outputs.tag }}
    secrets: inherit
